<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: LGPL-2.1-or-later — Lapidary_DopTransfer: the
     stone flipped through the girdle plane, crown up above, pavilion down
     below, with the turn-over arrows. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- crown-up stone, above the girdle line -->
  <g stroke="#1a5276" stroke-width="2.2" stroke-linejoin="round" fill="#aed6f1">
    <polygon points="20,26 25,15 39,15 44,26"/>
  </g>
  <!-- pavilion-down stone, below it -->
  <g stroke="#1a5276" stroke-width="2.2" stroke-linejoin="round" fill="#d6eaf8">
    <polygon points="20,38 44,38 32,55"/>
  </g>
  <!-- the girdle / transfer plane -->
  <line x1="6" y1="32" x2="58" y2="32" stroke="#1a5276" stroke-width="2.4"
        stroke-linecap="round" stroke-dasharray="6 4"/>
  <!-- turn-over arrows -->
  <g stroke="#b9770e" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M 50 24 A 10 10 0 0 1 50 40"/>
    <path d="M 14 40 A 10 10 0 0 1 14 24"/>
  </g>
  <g fill="#b9770e">
    <polygon points="50,40 45.5,35 54.5,35"/>
    <polygon points="14,24 9.5,29 18.5,29"/>
  </g>
</svg>
