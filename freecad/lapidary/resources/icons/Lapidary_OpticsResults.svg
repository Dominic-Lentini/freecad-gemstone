<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: LGPL-2.1-or-later — Lapidary_OpticsResults: a
     small brightness map (checkered light/dark cells) beside a rising tilt
     curve: the stored optics results. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- map panel -->
  <g stroke="#1a5276" stroke-width="2">
    <rect x="6" y="8" width="28" height="28" fill="#fff"/>
  </g>
  <g stroke="none">
    <rect x="8" y="10" width="12" height="12" fill="#f4f1e4"/>
    <rect x="20" y="10" width="12" height="12" fill="#466eb4"/>
    <rect x="8" y="22" width="12" height="12" fill="#466eb4"/>
    <rect x="20" y="22" width="12" height="12" fill="#38383c"/>
  </g>
  <!-- curve panel -->
  <g stroke="#1a5276" stroke-width="2" fill="none">
    <polyline points="10,58 10,42 58,42"/>
  </g>
  <polyline points="12,46 24,47 36,50 48,55" fill="none" stroke="#b9770e"
            stroke-width="2.6" stroke-linecap="round"/>
  <!-- headline number chip -->
  <g stroke="#196f3d" stroke-width="1.8" fill="#a9dfbf">
    <rect x="40" y="10" width="18" height="12" rx="2"/>
  </g>
</svg>
